<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f5f2ec" />
    <!-- Vercel serves this file, as is, for any path that matches nothing else, with a
         404 status. Vite copies it from public/ untouched, so it can't use index.css or
         the site's hashed font files: 404.css has the tokens it needs, copied from
         index.css, and the serif stack falls back to Georgia. A file rather than a
         <style>, so the Content-Security-Policy needs no inline-style exception. Every
         path here is root-absolute, since the page shows at any depth. Laid out like
         the no-JavaScript page (.noscript in index.css), with the Hero's eyebrow row. -->
    <link rel="stylesheet" href="/404.css" />
    <!-- Light or dark, like the rest of the site (the visitor's choice, else the system's) -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>Not found.</h1>
      <p>This address doesn't lead anywhere on my site.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
