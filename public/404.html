<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f5f2ec" />
    <!-- Vercel serves this file, as is, for any path that matches nothing else, with a
         404 status. Vite copies it from public/ untouched, so it can't use index.css or
         the site's hashed font files: the tokens it needs are copied from index.css, and
         the serif stack falls back to Georgia. Laid out like the no-JavaScript page
         (.noscript in index.css), with the Hero's eyebrow row. -->
    <style>
      :root {
        --font-serif: 'DM Serif Display', Georgia, serif;
        --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --color-paper: #f5f2ec;
        --color-line: #d4cfc5;
        --color-ink: #0d0d0d;
        --color-muted: #666666;
        --color-purple: #7F77DD;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--color-paper);
        color: var(--color-ink);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.85;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        max-width: 480px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 96px 24px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--color-muted);
      }

      .eyebrow::before {
        content: "";
        width: 32px;
        height: 1px;
        background: var(--color-purple);
        flex-shrink: 0;
      }

      h1 {
        font-family: var(--font-serif);
        font-size: 52px;
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.03em;
      }

      p:not(.eyebrow) {
        color: var(--color-muted);
      }

      /* The nav's Resume button */
      a {
        align-self: flex-start;
        border: 0.5px solid var(--color-line);
        border-radius: 2px;
        padding: 6px 14px;
        color: var(--color-ink);
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 2px solid var(--color-purple);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>Not found.</h1>
      <p>This address doesn't lead anywhere on my site.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
