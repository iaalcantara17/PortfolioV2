<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/dm-serif-display-latin-400.woff2" crossorigin />

      rel="preload"
      as="image"
      type="image/avif"
      href="/src/assets/photos/portrait-1200.avif"
      imagesrcset="/src/assets/photos/portrait-400.avif 400w, /src/assets/photos/portrait-1200.avif 1200w, /src/assets/photos/portrait-2400.avif 2400w"
      imagesizes="(max-width: 420px) 150vw, 630px"
      fetchpriority="high"
